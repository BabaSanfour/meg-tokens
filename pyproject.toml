[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meg-tokens"
version = "0.2.0"
description = "Library for analyzing brain dynamics and behavior during the Tokens decision-making task."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Karim" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.14.6",
    "mne>=1.0.0",
    "mne-bids>=0.12.0",
    "nibabel>=3.2.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "nptdms>=1.3.0",
    "scikit-learn>=1.0.0",
    "mne-connectivity>=0.5.0",
    "specparam>=2.0.0",
    "xarray>=2023.1.0",
    "tomli>=2.0.0; python_version<'3.11'"
]

[project.scripts]
meg-tokens = "meg_tokens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "ipykernel>=6.0.0"
]
workflow = [
    "snakemake>=7.32.0,<8.0.0",
    "pulp>=2.7.0,<2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meg_tokens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv"]
