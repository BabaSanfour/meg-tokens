[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meg-tokens"
version = "0.1.0"
description = "A refactored clean library for analyzing brain dynamics and behavior during the Tokens decision-making task."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Karim" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "mne>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "nptdms>=1.3.0",
    "scikit-learn>=1.0.0",
    "specparam>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "ipykernel>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meg_tokens*"]
