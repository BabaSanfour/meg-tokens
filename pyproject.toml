[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meg-tokens"
version = "0.2.0"
description = "Library for analyzing brain dynamics and behavior during the Tokens decision-making task."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Karim" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.14.6",
    "mne>=1.13.2",
    "mne-bids>=0.12.0",
    "h5io>=0.2.5",
    "mne-denoise[mne]==0.0.3",
    "nibabel>=3.2.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "nptdms>=1.3.0",
    "scikit-learn>=1.0.0",
    "mne-connectivity>=0.5.0",
    "specparam>=2.0.0rc0",
    "xarray>=2023.1.0",
    "coco-pipe @ git+https://github.com/BabaSanfour/coco-pipe@4c88ff3096b955788ed5ac0ac567cf787d4357dd"
]

[project.scripts]
meg-tokens = "meg_tokens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.17.1",
    "pre-commit>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "ipykernel>=6.0.0"
]
workflow = [
    "snakemake>=9.27.0",
    "snakemake-executor-plugin-slurm>=2.8.0",
]
modeling = [
    "pyddm>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meg_tokens*"]

[tool.ruff]
extend-exclude = ["archive"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports and variables) and syntax errors:
# the errors that leave dead code behind. Style is not enforced.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv"]
# npTDMS 1.12.1 (latest) still sets `buffer.dtype = ...` in base_segment.py,
# which NumPy 2.5 deprecates: its fix for this (#366) missed `fromfile()`, now
# https://github.com/adamreeve/npTDMS/issues/371. This silences that one
# message from that one module and nothing else -- drop it once a release
# closes #371. Our own warnings stay visible.
filterwarnings = [
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:nptdms.base_segment",
]
