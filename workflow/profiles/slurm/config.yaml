jobs: 320
latency-wait: 120
printshellcmds: true
rerun-incomplete: true
# Snakemake >= 8 submits through snakemake-executor-plugin-slurm: threads,
# mem_mb and runtime become --cpus-per-task, --mem and --time on their own.
executor: slurm
default-resources:
  slurm_account: "rrg-kjerbi_cpu"
  mem_mb: 8000
  runtime: 240
set-resources:
  # One core: the stage is single-threaded. The executor always names a
  # partition, and the cluster default (by-node) refuses a one-core job.
  preprocess:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 180
  # The behavioral stages mirror what their Slurm scripts asked for. b1 takes
  # jobs up to 3 h, b2 up to 12 h.
  behavior:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  behavior_analyze:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
  behavior_characterization:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
  behavior_report:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
  ssm_fit:
    slurm_partition: cpubase_bycore_b2
    mem_mb: 16000
    runtime: 480
  ssm_aggregate:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  ssm_evaluate:
    slurm_partition: cpubase_bycore_b2
    runtime: 720
  ssm_evaluate_aggregate:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  ssm_robustness:
    slurm_partition: cpubase_bycore_b2
    mem_mb: 16000
    runtime: 480
  ssm_robustness_aggregate:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  ssm_exclusion_robustness:
    slurm_partition: cpubase_bycore_b2
    mem_mb: 24000
    runtime: 720
  ssm_exclusion_robustness_aggregate:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  ssm_recovery:
    slurm_partition: cpubase_bycore_b2
    mem_mb: 24000
    runtime: 720
  ssm_recovery_aggregate:
    slurm_partition: cpubase_bycore_b1
    runtime: 60
  # One subject: ten runs, both streams, four locks, one at a time.
  epoch_amplitudes:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 8000
    runtime: 120
  epoch_thresholds:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
  epochs:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 8000
    runtime: 120
  # Measured on the cohort: a subject's covariance, 3-layer BEM and source
  # space take about 5 min; a run's forward and two inverses about 1 min.
  source_models:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
  source:
    slurm_partition: cpubase_bycore_b1
    mem_mb: 16000
    runtime: 60
