jobs: 64
latency-wait: 120
printshellcmds: true
rerun-incomplete: true
# Snakemake >= 8 submits through snakemake-executor-plugin-slurm: threads,
# mem_mb and runtime become --cpus-per-task, --mem and --time on their own.
executor: slurm
default-resources:
  slurm_account: "YOUR_ACCOUNT"
  mem_mb: 8000
  runtime: 240
set-resources:
  preprocess:
    mem_mb: 32000
    runtime: 1440
  epochs:
    mem_mb: 64000
    runtime: 1440
  source_models:
    mem_mb: 32000
    runtime: 2880
  source_run:
    mem_mb: 32000
    runtime: 2880
  power:
    mem_mb: 32000
    runtime: 1440
  decoding:
    mem_mb: 32000
    runtime: 480
