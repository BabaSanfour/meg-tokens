# Install once: `pre-commit install` (with the dev extra installed).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: lazy-exports
        name: every lazy export resolves
        entry: .venv/bin/python -m pytest -q tests/test_lazy_exports.py
        language: system
        types: [python]
        pass_filenames: false
